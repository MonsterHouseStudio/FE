<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e11d2a" />
    <title>MONSTER HOUSE</title>
    <meta
      name="description"
      content="보디빌딩 미디어 MONSTER HOUSE — 바디프로필 · 모티베이션 영상 · 센터 홍보 촬영"
    />
    <!-- 검색엔진에 언어 관계 명시 (기획서 §2.1) -->
    <link rel="alternate" hreflang="ko" href="/ko" />
    <link rel="alternate" hreflang="ja" href="/ja" />
    <link rel="alternate" hreflang="x-default" href="/ko" />

    <!-- 웹폰트: 본문·제목은 Pretendard(한/영) + Pretendard JP(일), 영문 라벨은 Anton -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap" />

    <!-- 저장된 테마를 렌더 전에 적용해 깜빡임(FOUC) 방지. 기본은 다크. -->
    <script>
      try {
        if (localStorage.getItem('mh-theme') === 'light') {
          document.documentElement.classList.add('light')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
