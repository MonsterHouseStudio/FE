name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Actions 화면에서 "Run workflow" 로 수동 배포도 가능하게.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 타입 검사 · 빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # package-lock.json 기준으로 node_modules 를 캐싱합니다.
          cache: npm

      # install 이 아니라 ci 입니다.
      # ci 는 package-lock.json 을 그대로 설치하고, lock 과 package.json 이
      # 어긋나면 실패합니다. 로컬과 CI 가 다른 버전을 쓰는 사고를 막습니다.
      - name: 의존성 설치
        run: npm ci

      # ★ 이 단계가 오늘 실제로 버그를 잡았습니다.
      #   백엔드는 locale 을 "KO"/"JA" 로 내려주는데 프론트가 'ko'/'ja' 로 비교해
      #   한국 대회에 일본어 제목이 뜨던 문제입니다.
      #   화면이 깨지지 않아서 눈으로는 못 찾고, 타입 검사가 5곳을 정확히 짚었습니다.
      - name: 타입 검사
        run: npm run lint

      - name: 프로덕션 빌드
        run: npm run build

  e2e:
    name: 크로스 브라우저 (Chromium · Firefox · WebKit)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 히어로 배너가 쓰는 scroll-snap · 100dvh · 비디오 자동재생은
      # 엔진마다 다르게 동작합니다. Chromium 하나로는 아무것도 보장하지 못합니다.
      # WebKit 은 iOS Safari 와 같은 엔진이라 실기기 없이 Safari 계열을 잡아줍니다.
      - name: 브라우저 엔진 설치
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E
        run: npx playwright test

      - name: 실패 시 트레이스 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # ⚠ Vite 는 VITE_* 를 빌드 시점에 번들에 박습니다.
      #   운영 배포용 이미지를 만들 때 VITE_USE_MOCK 을 빠뜨리면
      #   목 데이터가 그대로 나가므로 여기서도 명시적으로 넣어 확인합니다.
      - name: Dockerfile 검증
        run: |
          docker build -t monsterhouse/frontend:ci \
            --build-arg VITE_USE_MOCK=false \
            --build-arg VITE_API_BASE_URL=/api \
            .

  deploy:
    name: 서버 배포
    runs-on: ubuntu-latest
    # 타입검사·빌드·E2E·이미지가 모두 통과해야 배포합니다.
    needs: [build, e2e, docker]
    # main 에 push 되고, 저장소 변수 DEPLOY=true 일 때만 실제 배포합니다.
    # (변수를 켜기 전까지 이 잡은 건너뜁니다 — 시크릿 준비 전 빨간 실패 방지)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY == 'true'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # deploy.sh 는 BE·FE 를 함께 pull 후 재빌드하므로, 어느 저장소에서 밀어도 최신으로 배포됩니다.
      - name: SSH 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/monsterhouse/BE/deploy
            ./deploy.sh
