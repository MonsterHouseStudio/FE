# ⚠ log_format 은 http 컨텍스트에서만 허용됩니다.
#   server {} 안에 넣으면 nginx 가 아예 기동하지 못합니다:
#     [emerg] "log_format" directive is not allowed here
#   이 파일은 /etc/nginx/conf.d/ 에 놓여 http 블록 안에서 include 되므로
#   server {} 바깥인 여기가 올바른 위치입니다.
#
# 프록시(Ingress) 뒤에 있어 접속자 IP 는 X-Forwarded-For 로 넘어옵니다.
# 로그에 프록시 IP 만 남으면 스팸 추적이 불가능해집니다.
log_format mh '$http_x_forwarded_for - $remote_user [$time_local] '
              '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/access.log mh;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # 쿠버네티스 프로브 전용. SPA 폴백을 타지 않도록 먼저 선언합니다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite 가 파일명에 해시를 넣으므로(app-a1b2c3.js) 내용이 바뀌면 이름이 바뀝니다.
    # 따라서 영구 캐시가 안전합니다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ★ index.html 은 절대 캐시하지 않습니다.
    #   여기에 새 번들 파일명이 적혀 있어서, 캐시되면 사용자가 배포 후에도
    #   옛 번들을 계속 보게 됩니다. "배포했는데 안 바뀌어요"의 대부분이 이 문제입니다.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA 폴백 — /ko, /ja, /admin/bookings 같은 클라이언트 라우트를 index.html 로 넘깁니다.
    #
    # ⚠ /api 와 /uploads 는 여기서 처리하지 않습니다.
    #   Ingress 가 그 경로를 백엔드로 먼저 보내기 때문입니다.
    #   만약 이 컨테이너로 들어온다면 라우팅이 잘못된 것이므로,
    #   index.html 을 200 으로 돌려주는 대신 404 로 드러나게 두는 편이 낫습니다
    #   (전에 Vite 폴백이 이미지 요청에 index.html 을 200 으로 주는 바람에
    #    브라우저가 조용히 깨진 적이 있습니다).
    location ^~ /api/ {
        return 404;
    }
    location ^~ /uploads/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
